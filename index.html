<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Magnifico Suites — Guida per gli ospiti</title>
    <meta
      name="description"
      content="Libro di benvenuto digitale per gli ospiti di Magnifico Suites, a Roma."
    />
    <meta name="theme-color" content="#2F3E52" />
    <meta name="color-scheme" content="light" />
    <meta name="ms-version" content="20261031b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Magnifico" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" as="image" href="icons/logo.svg?v=20261031b" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600&family=Noto+Sans+Arabic:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+JP:wght@500;600&family=Noto+Serif+SC:wght@500;600&family=Outfit:wght@300;400;500&family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20261031b" />
    <script>
      window.MAGNIFICO_VERSION = "20261031b";
      (function () {
        var codes = { it: 1, en: 1, es: 1, fr: 1, de: 1, pt: 1, zh: 1, ja: 1, ar: 1 };
        function match(tag) {
          var value = String(tag || "").toLowerCase();
          if (value.indexOf("zh") === 0) return "zh";
          var base = value.split("-")[0];
          return codes[base] ? base : "";
        }
        var lang = "it";
        try {
          var saved = localStorage.getItem("magnifico-suites-lang");
          if (codes[saved]) {
            lang = saved;
          } else {
            var list = navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language || "it"];
            for (var i = 0; i < list.length; i++) {
              var hit = match(list[i]);
              if (hit) {
                lang = hit;
                break;
              }
            }
          }
        } catch (e) {
          lang = "it";
        }
        var root = document.documentElement;
        root.lang = lang;
        root.dir = lang === "ar" ? "rtl" : "ltr";
        root.dataset.lang = lang;
        try {
          var seen = sessionStorage.getItem("magnifico-suites-intro") === "1";
          var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (seen || reduceMotion) root.classList.add("intro-seen");
        } catch (e) {
          /* private mode */
        }
        root.classList.add("js");
      })();
    </script>
  </head>
  <body>
    <div id="intro" class="intro" aria-hidden="true">
      <div class="intro-inner">
        <img
          id="intro-logo"
          class="intro-logo"
          src="icons/logo.svg?v=20261031b"
          alt=""
          width="346"
          height="260"
          fetchpriority="high"
          draggable="false"
        />
        <p id="intro-title" class="intro-title"></p>
        <p id="intro-name" class="intro-name"></p>
      </div>
    </div>
    <noscript>
      <style>
        #intro { display: none; }
        html:not(.intro-seen) .hero-logo { visibility: visible; }
      </style>
    </noscript>

    <a class="skip" id="skip" href="#sections">Vai alle sezioni</a>

    <header class="hero">
      <div class="hero-bar">
        <div id="lang-home" class="lang"></div>
      </div>
      <div class="hero-main">
        <h1 class="hero-logo-wrap">
          <img
            class="hero-logo"
            src="icons/logo.svg?v=20261031b"
            alt="Magnifico Suites"
            width="346"
            height="260"
          />
        </h1>
        <p class="hero-eyebrow" id="hero-eyebrow"></p>
        <p class="hero-name" id="hero-name"></p>
        <a class="hero-address" id="hero-address" href="#"></a>
        <div class="hero-times" id="hero-times" hidden></div>
      </div>
    </header>

    <main class="main">
      <section id="quick" class="band"></section>
      <section id="gallery" class="band"></section>
      <section id="sections" class="band guide" tabindex="-1"></section>
    </main>

    <footer class="footer">
      <img class="footer-line" src="icons/rome-line.svg?v=20261031b" alt="" width="360" height="78" />
      <div id="footer-body" class="footer-body"></div>
    </footer>

    <button type="button" id="to-top" class="to-top">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 12 7-7 7 7" />
        <path d="M12 19V5" />
      </svg>
    </button>

    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
      <div class="sheet-panel">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-bar">
          <button type="button" class="back" id="sheet-back">
            <svg class="flip" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 5 8 12l7 7" />
            </svg>
            <span id="back-label">Indietro</span>
          </button>
          <h2 id="sheet-title" class="sheet-title"></h2>
          <div id="lang-sheet" class="lang lang-compact"></div>
        </div>
        <div class="sheet-scroll">
          <div id="sheet-body" class="sheet-body"></div>
        </div>
      </div>
    </dialog>

    <dialog id="lightbox" class="lightbox" aria-labelledby="lb-cap">
      <div class="lb-stage">
        <img id="lb-img" alt="" />
        <button type="button" id="lb-close" class="lb-btn lb-close">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
        <button type="button" id="lb-prev" class="lb-btn lb-prev">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5 8 12l7 7" />
          </svg>
        </button>
        <button type="button" id="lb-next" class="lb-btn lb-next">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 5 7 7-7 7" />
          </svg>
        </button>
        <p id="lb-cap" class="lb-cap"></p>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status"></div>
    <p id="live" class="visually-hidden" aria-live="polite"></p>

    <script src="content.js?v=20261031b"></script>
    <script src="app.js?v=20261031b"></script>
  </body>
</html>
